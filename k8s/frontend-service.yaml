apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: beardbuddy
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: ghcr.io/beardbuddy/frontend/frontend:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 3000 }]
          env:
            # Resolved per request by /api/config, so this image is not environment-specific.
            # The browser calls the backend directly, so this must be reachable from outside
            # the cluster — not the in-cluster Service DNS name.
            - name: API_BASE_URL
              value: http://localhost:30080
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: beardbuddy
spec:
  type: NodePort
  selector: { app: frontend }
  ports: [{ port: 3000, targetPort: 3000, nodePort: 30300 }]
