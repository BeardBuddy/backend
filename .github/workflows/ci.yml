name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          # Restores and saves ~/.m2 keyed on the pom files.
          cache: maven

      - name: Build all modules
        run: mvn -B -DskipTests package

      # Handed to the docker job so images are packaged, not compiled.
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            api/target/beardbuddy-api.jar
            worker/target/beardbuddy-worker.jar
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests
        run: mvn -B test

  docker:
    needs: [build, test]
    # Only publish from the integration branch; PR builds stop at build + test.
    if: github.event_name == 'push' && github.ref == 'refs/heads/huy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, worker]
    steps:
      - uses: actions/checkout@v4

      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          name: jars

      - name: Restore jar layout
        run: |
          mkdir -p ${{ matrix.service }}/target
          mv beardbuddy-${{ matrix.service }}.jar ${{ matrix.service }}/target/

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
