name: beardbuddy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: beardbuddy
      POSTGRES_USER: beardbuddy
      POSTGRES_PASSWORD: beardbuddy
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beardbuddy -d beardbuddy"]
      interval: 5s
      timeout: 5s
      retries: 20

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      # ZooKeeper denies four-letter-word commands by default (only srvr is enabled),
      # so ruok must be whitelisted for the healthcheck below to get a response.
      KAFKA_OPTS: -Dzookeeper.4lw.commands.whitelist=srvr,ruok
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      zookeeper:
        condition: service_healthy
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Two listeners: one for other containers, one for the host on :9092.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile.api.local
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/beardbuddy
      SPRING_DATASOURCE_USERNAME: beardbuddy
      SPRING_DATASOURCE_PASSWORD: beardbuddy
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      BEARDBUDDY_CORS_ORIGINS: http://localhost:3000
      BEARDBUDDY_JWT_SECRET: ${BEARDBUDDY_JWT_SECRET:-local-dev-secret-change-me-please-32-bytes-min}
    volumes:
      - api-logs:/var/log/beardbuddy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker.local
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # The API creates the schema, so the worker must not start before it has.
      app:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/beardbuddy
      SPRING_DATASOURCE_USERNAME: beardbuddy
      SPRING_DATASOURCE_PASSWORD: beardbuddy
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - worker-logs:/var/log/beardbuddy

  # The frontend lives in its own repository. Override the path if you cloned it
  # somewhere other than a sibling directory:  FRONTEND_PATH=../my-frontend docker compose up
  frontend:
    build:
      context: ${FRONTEND_PATH:-../masproject}
      dockerfile: Dockerfile.local
    ports: ["3000:3000"]
    environment:
      # Read at request time by /api/config, so the image is environment-agnostic.
      # The browser calls the backend directly, hence localhost rather than a service name.
      API_BASE_URL: http://localhost:8080
    depends_on:
      app:
        condition: service_started

volumes:
  postgres-data:
  api-logs:
  worker-logs:
