server:
  port: 8080

spring:
  application:
    name: beardbuddy-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/beardbuddy}
    username: ${SPRING_DATASOURCE_USERNAME:beardbuddy}
    password: ${SPRING_DATASOURCE_PASSWORD:beardbuddy}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      # The API owns the schema: it drops and recreates every table, then seeds.
      # The worker must NOT do this (see the worker's own config).
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    # Seed scripts must run before Hibernate touches anything.
    defer-datasource-initialization: false

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Batch aggressively: /barbers/load publishes thousands of events in a burst.
        linger.ms: 20
        batch.size: 65536
      acks: all

beardbuddy:
  cors:
    allowed-origins: ${BEARDBUDDY_CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  kafka:
    barber-topic: ${BEARDBUDDY_KAFKA_BARBER_TOPIC:barber.created}
  jwt:
    # Override in every real deployment: docker-compose and k8s both pass this in.
    secret: ${BEARDBUDDY_JWT_SECRET:local-dev-secret-change-me-please-32-bytes-min}
    ttl-minutes: ${BEARDBUDDY_JWT_TTL_MINUTES:120}
  cookie:
    # Frontend and API on different hosts (cloud): SameSite=None + Secure=true, or the browser
    # drops the auth cookie and every call after login is a 401. Same host (compose): Lax/false.
    same-site: ${BEARDBUDDY_COOKIE_SAME_SITE:Lax}
    secure: ${BEARDBUDDY_COOKIE_SECURE:false}
  password:
    # BCrypt cost factor (log2 rounds), 4..31. Each +1 doubles the hashing time; 10-12 is typical.
    bcrypt-rounds: ${BEARDBUDDY_BCRYPT_ROUNDS:10}
  barber-import:
    # How many barbers one click of "Import barbers" creates.
    batch-size: ${BEARDBUDDY_IMPORT_BATCH_SIZE:10}
    # Upper bound for the custom /api/barbers/load endpoint.
    max-batch-size: ${BEARDBUDDY_IMPORT_MAX_BATCH_SIZE:200}
    # Minimum time between two imports by the same user.
    cooldown-seconds: ${BEARDBUDDY_IMPORT_COOLDOWN_SECONDS:300}
  rate-limit:
    # Fixed one-minute windows, counted in memory per API instance.
    # Login/register, per client IP: slows down password guessing and signup spam.
    auth-per-minute: ${BEARDBUDDY_RATE_LIMIT_AUTH_PER_MINUTE:10}
    # Everything else, per signed-in user (or per IP when anonymous).
    api-per-minute: ${BEARDBUDDY_RATE_LIMIT_API_PER_MINUTE:120}
    # Reverse proxies in front of the API that append to X-Forwarded-For (Railway's edge = 1).
    # 0 = ignore the header and use the socket address.
    trusted-proxies: ${BEARDBUDDY_RATE_LIMIT_TRUSTED_PROXIES:1}
  schedule:
    # How far ahead the worker materialises schedules.
    horizon-days: ${BEARDBUDDY_SCHEDULE_HORIZON_DAYS:365}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.hibernate.SQL: warn
    org.apache.kafka: warn
